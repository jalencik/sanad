<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanad — Document Intelligence Platform</title>
    <meta
      name="description"
      content="Upload official documents in any language and get structured details plus an AI-generated summary in seconds."
    />
    <!-- Fonts load from the HTML head instead of a CSS @import: an @import
         only starts downloading after the bundled CSS itself arrives, adding
         a full serial round-trip before any text can render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- Inline and self-contained on purpose: main.ts holds app.mount() until
         the /auth/me check resolves (see main.ts), and that request can sit
         for as long as a sleeping Render free instance takes to wake up.
         This markup is the only thing guaranteed to paint before any of
         that, so it can't depend on style.css or main.ts having loaded.
         Vue's mount() overwrites #app's contents the instant it runs, so on
         a warm load this just disappears; it only lingers during a real wait. -->
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: oklch(0.985 0.004 90);
        color: oklch(0.19 0.03 265);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      #app-loading .mark {
        font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
        font-size: 1.5rem;
      }
      #app-loading .spinner {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 50%;
        border: 2px solid oklch(0.62 0.11 70 / 25%);
        border-top-color: oklch(0.62 0.11 70);
        animation: app-loading-spin 0.8s linear infinite;
      }
      #app-loading .note {
        max-width: 26rem;
        font-size: 0.875rem;
        color: oklch(0.48 0.02 265);
      }
      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="spinner" role="status" aria-label="Loading"></div>
        <div class="mark">Sanad</div>
        <p class="note">
          Waking up the server — we run on a free tier that sleeps after a few
          idle minutes, so the first load back can take up to a minute.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
