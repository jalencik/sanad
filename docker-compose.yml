services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sanad
      POSTGRES_PASSWORD: sanad
      POSTGRES_DB: sanad
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanad -d sanad"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://sanad:sanad@db:5432/sanad
      # At least one of GROQ_API_KEYS / GEMINI_API_KEYS is required - the
      # backend refuses to process documents (with a clear error) if both
      # are empty. Not enforced here with a hard `:?` since either one alone
      # is a valid, complete config - see .env.example.
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      CORS_ORIGINS: '["http://localhost", "http://localhost:8080"]'
      ADMIN_EMAILS: ${ADMIN_EMAILS:-[]}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      COOKIE_SECURE: "false"
      # Fixed subnet below - only the frontend (nginx) container can ever
      # legitimately connect from inside it, so it's safe to trust
      # X-Forwarded-For from this whole range (see app/main.py).
      TRUSTED_PROXY_HOSTS: 172.28.0.0/16
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
